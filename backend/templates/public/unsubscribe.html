<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Unsubscribe — AUB SQUARE</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B0B12;color:#fff;font-family:system-ui,sans-serif;padding:16px}.c{max-width:440px;background:#191430;border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:32px;text-align:center}button{background:linear-gradient(90deg,#EC008C,#7B2FFF);color:#fff;border:0;border-radius:12px;padding:12px 24px;font-weight:600;cursor:pointer}p{color:#b8b4c9}</style></head>
<body><div class="c"><h1>{% if done %}You're unsubscribed{% else %}Unsubscribe{% endif %}</h1>
{% if done %}<p>{{ subscriber.email }} will no longer receive marketing emails from AUB SQUARE.</p>{% else %}<p>Stop marketing emails to {{ subscriber.email }}?</p><form method="post">{% csrf_token %}<button>Confirm unsubscribe</button></form>{% endif %}</div></body></html>
