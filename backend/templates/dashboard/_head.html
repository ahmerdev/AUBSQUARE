{% load static dash %}<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="csrf-token" content="{{ csrf_token }}">
<meta name="theme-color" content="#09080E">
<meta name="geo-src" content="{% vstatic 'dashboard/geo.json' %}">
<meta name="color-scheme" content="light dark">
<script>(function(){var t=null;try{t=localStorage.getItem("aub.theme")}catch(e){}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark"}document.documentElement.setAttribute("data-theme",t);var r=null;try{r=localStorage.getItem("aub.rail")}catch(e){}if(r!=="open"&&r!=="closed"){r=window.innerWidth>=1360?"open":"closed"}document.documentElement.setAttribute("data-rail",r)})();</script>
{% if brand.favicon %}<link rel="icon" href="{{ brand.favicon }}"><link rel="apple-touch-icon" href="{{ brand.favicon }}">{% else %}<link rel="icon" href="{% static 'dashboard/favicon.svg' %}" type="image/svg+xml">{% endif %}
{{ brand.fonts_html }}
<link rel="stylesheet" href="{% vstatic 'dashboard/dashboard.css' %}">
